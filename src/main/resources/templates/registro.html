<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/png" th:href="@{/img/logo_sia_fondo.png}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro - SIA</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0a0f 0%, #12121f 30%, #1a1a2e 60%, #16213e 80%, #0f0f1a 100%);
      background-size: 400% 400%;
      animation: gradientShift 14s ease infinite;
      display: flex; flex-direction: column;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(99,102,241,0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(139,92,246,0.10) 0%, transparent 50%);
      pointer-events: none; z-index: 0;
    }

    /* ── Header ── */
    header {
      position: relative; z-index: 10;
      padding: 14px 24px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; justify-content: space-between; align-items: center;
    }
    .brand { color: #a5b4fc; font-weight: 700; font-size: 18px; letter-spacing: 2px; }
    .nav-btn {
      padding: 7px 18px; font-size: 13px; font-weight: 500;
      color: #a5b4fc; border: 1.5px solid rgba(165,180,252,0.35);
      border-radius: 20px; text-decoration: none;
      transition: all 0.3s; background: transparent; cursor: pointer;
    }
    .nav-btn:hover { background: rgba(165,180,252,0.12); color: #fff; border-color: rgba(165,180,252,0.6); }

    /* ── Main ── */
    main {
      flex: 1; display: flex; justify-content: center; align-items: flex-start;
      padding: 30px 20px; position: relative; z-index: 1;
    }

    /* ── Card ── */
    .reg-card {
      width: 100%; max-width: 480px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 24px 64px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.08);
      animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
      position: relative;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .reg-card::before {
      content: '';
      position: absolute; top: 0; left: 20%; right: 20%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(165,180,252,0.5), transparent);
    }

    /* ── Robot ── */
    .robot-wrap { text-align: center; margin-bottom: 6px; }
    .robot-wrap img {
      width: 80px; height: 80px; object-fit: contain;
      filter: drop-shadow(0 0 14px rgba(139,92,246,0.5));
    }

    /* ── Título ── */
    .card-title { text-align: center; margin-bottom: 24px; }
    .card-title h1 { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .card-title p  { font-size: 12px; color: rgba(255,255,255,0.4); }

    /* ── Errores del servidor ── */
    .server-errors {
      background: rgba(255,60,60,0.12);
      border: 1px solid rgba(255,80,80,0.4);
      border-radius: 10px; padding: 10px 14px;
      margin-bottom: 18px; font-size: 13px; color: #ff8080;
    }
    .server-errors ul { padding-left: 18px; margin-top: 4px; }
    .close-btn {
      float: right; background: transparent; border: none;
      font-size: 16px; color: #ff8080; cursor: pointer;
    }

    /* ── Campos ── */
    .field { margin-bottom: 14px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600;
      color: rgba(255,255,255,0.55); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.7px;
    }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-wrap .icon {
      position: absolute; left: 13px; color: rgba(255,255,255,0.3);
      font-size: 13px; pointer-events: none;
    }
    .input-wrap input {
      width: 100%; padding: 11px 13px 11px 38px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; color: #fff; font-size: 13px;
      font-family: 'Poppins', sans-serif;
      transition: all 0.3s; outline: none;
    }
    .input-wrap input::placeholder { color: rgba(255,255,255,0.22); }
    .input-wrap input:focus {
      border-color: rgba(165,180,252,0.55);
      background: rgba(165,180,252,0.06);
      box-shadow: 0 0 0 3px rgba(139,92,246,0.12);
    }
    .input-wrap input.input-error {
      border-color: rgba(239,68,68,0.7) !important;
      background: rgba(239,68,68,0.06) !important;
    }
    .input-wrap .eye {
      position: absolute; right: 12px; cursor: pointer;
      color: rgba(255,255,255,0.25); font-size: 13px; transition: color 0.2s;
    }
    .input-wrap .eye:hover { color: #a5b4fc; }

    .field-err {
      font-size: 11px; color: #ff7070; margin-top: 4px;
      display: none; padding-left: 2px;
    }

    /* ── Sugeridor contraseña ── */
    .pass-wrapper { position: relative; }
    .pass-suggestion {
      display: none;
      position: absolute; top: calc(100% + 6px); left: 0; right: 0;
      background: rgba(15,15,30,0.97);
      border: 1px solid rgba(165,180,252,0.3);
      border-radius: 10px; padding: 12px 14px; z-index: 200;
    }
    .pass-suggestion p { margin: 0 0 6px; font-size: 11px; color: rgba(255,255,255,0.5); }
    .suggested-pass {
      font-family: monospace; font-size: 14px; color: #a5b4fc;
      font-weight: 600; letter-spacing: 1px; word-break: break-all;
    }
    .btn-use-pass {
      width: 100%; margin-top: 8px; padding: 7px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; border: none;
      border-radius: 7px; font-weight: bold; font-size: 12px; cursor: pointer;
    }
    .btn-use-pass:hover { opacity: 0.9; }
    .btn-regen {
      width: 100%; margin-top: 5px; padding: 5px;
      background: transparent; color: rgba(255,255,255,0.4);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 7px; font-size: 11px; cursor: pointer;
    }
    .btn-regen:hover { color: #fff; border-color: rgba(255,255,255,0.35); }

    /* ── Botones principales ── */
    .btn-primary {
      width: 100%; padding: 13px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff; font-weight: 700; font-size: 14px;
      cursor: pointer; transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(99,102,241,0.35);
      font-family: 'Poppins', sans-serif; margin-top: 8px;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(99,102,241,0.5); }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 16px 0; color: rgba(255,255,255,0.15); font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.08);
    }

    .btn-secondary {
      width: 100%; padding: 11px; border-radius: 12px;
      border: 1.5px solid rgba(165,180,252,0.25);
      background: transparent; color: #a5b4fc;
      font-weight: 600; font-size: 13px; cursor: pointer;
      transition: all 0.3s; font-family: 'Poppins', sans-serif;
      text-decoration: none; display: block; text-align: center;
    }
    .btn-secondary:hover { background: rgba(165,180,252,0.08); border-color: rgba(165,180,252,0.5); }

    @media (max-width: 480px) {
      .reg-card { padding: 28px 18px; }
      header { padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <header>
    <span class="brand">SIA · SENA</span>
    <a th:href="@{/login}" class="nav-btn">Iniciar sesión</a>
  </header>

  <main>
    <div class="reg-card">

      <div class="robot-wrap">
        <img src="https://i.pinimg.com/originals/4b/cb/1f/4bcb1fb72d1d08efa44efa5ceb712ec7.gif" alt="Robot SIA">
      </div>

      <div class="card-title">
        <h1>Crear cuenta</h1>
        <p>Completa los datos para registrarte</p>
      </div>

      <!-- Mensaje flash -->
      <div id="mensajeRegistro" th:if="${mensaje}" th:text="${mensaje}" style="display:none;"></div>

      <form th:action="@{/registro/guardar}" method="post" th:object="${usuario}">

        <!-- Errores de validación -->
        <div th:if="${#fields.hasErrors()}" class="server-errors">
          <button class="close-btn" type="button" onclick="this.parentElement.style.display='none'">✖</button>
          <ul>
            <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
          </ul>
        </div>

        <!-- Nombre de usuario -->
        <div class="field">
          <label>Nombre de usuario</label>
          <div class="input-wrap">
            <i class="fas fa-at icon"></i>
            <input type="text" th:field="*{nombreUsuario}" placeholder="usuario123" required/>
          </div>
        </div>

        <!-- Nombres y Apellidos en fila -->
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="field">
            <label>Nombres</label>
            <div class="input-wrap">
              <i class="fas fa-user icon"></i>
              <input type="text" th:field="*{nombres}" placeholder="Juan" required/>
            </div>
          </div>
          <div class="field">
            <label>Apellidos</label>
            <div class="input-wrap">
              <i class="fas fa-user icon"></i>
              <input type="text" th:field="*{apellidos}" placeholder="Pérez" required/>
            </div>
          </div>
        </div>

        <!-- Correo -->
        <div class="field">
          <label>Correo electrónico</label>
          <div class="input-wrap">
            <i class="fas fa-envelope icon"></i>
            <input type="email" id="correo" th:field="*{correo}" placeholder="correo@ejemplo.com" required/>
          </div>
          <div class="field-err" id="correo-error">Los correos no coinciden.</div>
        </div>

        <!-- Confirmar correo -->
        <div class="field">
          <label>Confirmar correo</label>
          <div class="input-wrap">
            <i class="fas fa-envelope-open icon"></i>
            <input type="email" id="confirmCorreo" placeholder="Repite tu correo" required/>
          </div>
          <div class="field-err" id="confirmCorreo-error">Los correos no coinciden.</div>
        </div>

        <!-- Documento -->
        <div class="field">
          <label>Número de documento</label>
          <div class="input-wrap">
            <i class="fas fa-id-card icon"></i>
            <input type="text" id="noDocumento" th:field="*{noDocumento}"
                   inputmode="numeric" pattern="[0-9]+" placeholder="1234567890" required/>
          </div>
        </div>

        <!-- Contraseña -->
        <div class="field">
          <label>Contraseña</label>
          <div class="pass-wrapper">
            <div class="input-wrap">
              <i class="fas fa-lock icon"></i>
              <input type="password" id="passUsuario" th:field="*{passUsuario}"
                     placeholder="Mínimo 6 caracteres" required autocomplete="new-password"/>
              <i class="fas fa-eye-slash eye" id="eyePass" onclick="toggleEye('passUsuario','eyePass')"></i>
            </div>
            <div class="pass-suggestion" id="passSuggestion">
              <p>💡 Contraseña sugerida:</p>
              <div class="suggested-pass" id="suggestedPass"></div>
              <button type="button" class="btn-use-pass" onclick="usarContrasena()">Usar esta contraseña</button>
              <button type="button" class="btn-regen" onclick="generarContrasena()">↻ Generar otra</button>
            </div>
          </div>
        </div>

        <!-- Confirmar contraseña -->
        <div class="field">
          <label>Confirmar contraseña</label>
          <div class="input-wrap">
            <i class="fas fa-lock icon"></i>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                   placeholder="Repite la contraseña" required/>
            <i class="fas fa-eye-slash eye" id="eyeConfirm" onclick="toggleEye('confirmPassword','eyeConfirm')"></i>
          </div>
          <div class="field-err" id="pass-error">Las contraseñas no coinciden.</div>
        </div>

        <button type="submit" class="btn-primary">
          <i class="fas fa-user-plus"></i> Registrarse
        </button>
      </form>

      <div class="divider">o</div>
      <a th:href="@{/login}" class="btn-secondary">
        <i class="fas fa-sign-in-alt"></i> Ya tengo cuenta
      </a>

    </div>
  </main>

  <script>
    // SweetAlert flash
    const msg = document.getElementById('mensajeRegistro');
    if (msg && msg.innerText.trim()) {
      Swal.fire({
        icon: msg.innerText.includes('correctamente') ? 'success' : 'error',
        title: msg.innerText.includes('correctamente') ? '¡Éxito!' : 'Error',
        text: msg.innerText,
        confirmButtonColor: '#006B2D',
        timer: 3500, timerProgressBar: true
      });
    }

    // Solo números en documento
    const docInput = document.getElementById('noDocumento');
    docInput.addEventListener('input', () => { docInput.value = docInput.value.replace(/[^0-9]/g, ''); });
    docInput.addEventListener('keypress', e => { if (!/[0-9]/.test(e.key)) e.preventDefault(); });

    // Toggle ojo
    function toggleEye(inputId, iconId) {
      const inp = document.getElementById(inputId);
      const ico = document.getElementById(iconId);
      if (inp.type === 'password') {
        inp.type = 'text';
        ico.classList.replace('fa-eye-slash', 'fa-eye');
      } else {
        inp.type = 'password';
        ico.classList.replace('fa-eye', 'fa-eye-slash');
      }
    }

    // Generador contraseña
    function generarContrasena() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789@#$%&*!';
      let pass = [
        'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*24)],
        'abcdefghjkmnpqrstuvwxyz'[Math.floor(Math.random()*23)],
        '23456789'[Math.floor(Math.random()*8)],
        '@#$%&*!'[Math.floor(Math.random()*7)]
      ];
      for (let i = 4; i < 12; i++) pass.push(chars[Math.floor(Math.random()*chars.length)]);
      document.getElementById('suggestedPass').textContent =
        pass.sort(() => Math.random() - 0.5).join('');
    }

    function usarContrasena() {
      const pass = document.getElementById('suggestedPass').textContent;
      const p = document.getElementById('passUsuario');
      const c = document.getElementById('confirmPassword');
      p.type = c.type = 'text';
      p.value = c.value = pass;
      setTimeout(() => { p.type = c.type = 'password'; }, 1500);
      document.getElementById('passSuggestion').style.display = 'none';
      validarPasswords();
    }

    const passInput = document.getElementById('passUsuario');
    const passSugg  = document.getElementById('passSuggestion');
    passInput.addEventListener('focus', () => {
      if (!document.getElementById('suggestedPass').textContent) generarContrasena();
      passSugg.style.display = 'block';
    });
    document.addEventListener('click', e => {
      if (!passInput.contains(e.target) && !passSugg.contains(e.target))
        passSugg.style.display = 'none';
    });

    // Validaciones en tiempo real
    function validarCorreos() {
      const a = document.getElementById('correo').value;
      const b = document.getElementById('confirmCorreo').value;
      const ok = a === b;
      const show = b.length > 0 && !ok;
      document.getElementById('correo-error').style.display = show ? 'block' : 'none';
      document.getElementById('confirmCorreo-error').style.display = show ? 'block' : 'none';
      document.getElementById('correo').classList.toggle('input-error', show);
      document.getElementById('confirmCorreo').classList.toggle('input-error', show);
      return ok;
    }

    function validarPasswords() {
      const a = document.getElementById('passUsuario').value;
      const b = document.getElementById('confirmPassword').value;
      const ok = a === b;
      const show = b.length > 0 && !ok;
      document.getElementById('pass-error').style.display = show ? 'block' : 'none';
      document.getElementById('passUsuario').classList.toggle('input-error', show);
      document.getElementById('confirmPassword').classList.toggle('input-error', show);
      return ok;
    }

    document.getElementById('correo').addEventListener('input', validarCorreos);
    document.getElementById('confirmCorreo').addEventListener('input', validarCorreos);
    document.getElementById('passUsuario').addEventListener('input', validarPasswords);
    document.getElementById('confirmPassword').addEventListener('input', validarPasswords);

    document.querySelector('form').addEventListener('submit', e => {
      const cOk = validarCorreos();
      const pOk = validarPasswords();
      if (!cOk || !pOk) {
        e.preventDefault();
        Swal.fire({
          icon: 'error',
          title: 'Verifica los campos',
          text: !cOk ? 'Los correos no coinciden.' : 'Las contraseñas no coinciden.',
          confirmButtonColor: '#006B2D'
        });
      }
    });
  </script>
</body>
</html>
