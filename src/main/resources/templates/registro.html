<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
    <link rel="icon" type="image/png" th:href="@{/img/logo_sia_fondo.png}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro de Usuario</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: url('https://www.bloomberglinea.com/resizer/v2/RAEW7WILHFA3JJHMQAYOWKN4EM.jpeg?auth=2d9996b6e3bd09f86ba0666285d6c9a921996fb4e8ae4470773335616e80f35e&width=800&height=533&quality=80&smart=true') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    .form-container {
      background: rgba(0, 0, 0, 0.75);
      padding: 40px 35px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 420px;
      position: relative;
      color: #fff;
      text-align: center;
      box-sizing: border-box;
    }

    h2 {
      margin-bottom: 25px;
      font-weight: 600;
      font-size: 24px;
      color: #00FF99;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: 500;
      color: #fff;
      text-align: left;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-bottom: 10px;
      font-size: 14px;
    }

    button {
      width: 100%;
      background-color: #00FF99;
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-top: 15px;
    }

    button:hover {
      background-color: #00cc7a;
    }

    .robot {
      width: 80px;
      height: 80px;
      margin: 0 auto 15px auto;
    }

    .robot img {
      width: 100%;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .btn-google, .btn-login {
      margin-top: 10px;
      background: #555;
      color: #fff;
      text-decoration: none;
      display: block;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-login {
      background: #00FF99;
      color: #000;
    }

    .btn-google:hover, .btn-login:hover {
      opacity: 0.85;
    }

    .error-container {
      margin-bottom: 10px;
      background-color: #ff3333;
      border-radius: 8px;
      padding: 10px 15px;
      color: #fff;
      text-align: left;
    }

    .error-container ul {
      list-style: disc;
      padding-left: 20px;
      margin: 5px 0 0 0;
    }

    .close-btn {
      float: right;
      background: transparent;
      border: none;
      font-size: 18px;
      color: #fff;
      cursor: pointer;
    }

    input.input-error {
      border: 2px solid #ff4444 !important;
      background-color: #fff5f5;
    }

    .field-error-msg {
      color: #ff6b6b;
      font-size: 12px;
      text-align: left;
      margin: -6px 0 8px;
      display: none;
    }

    /* Sugeridor de contraseña */
    .pass-wrapper { position: relative; }
    .pass-suggestion {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: #1a1a1a;
      border: 1px solid #00FF99;
      border-radius: 8px;
      padding: 12px 14px;
      z-index: 100;
      text-align: left;
    }
    .pass-suggestion p {
      margin: 0 0 8px;
      font-size: 12px;
      color: #aaa;
    }
    .pass-suggestion .suggested-pass {
      font-family: monospace;
      font-size: 15px;
      color: #00FF99;
      font-weight: 600;
      letter-spacing: 1px;
      word-break: break-all;
    }
    .pass-suggestion .btn-use-pass {
      width: 100%;
      margin-top: 10px;
      padding: 8px;
      background: #00FF99;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }
    .pass-suggestion .btn-use-pass:hover { background: #00cc7a; }
    .pass-suggestion .btn-regen {
      width: 100%;
      margin-top: 6px;
      padding: 6px;
      background: transparent;
      color: #aaa;
      border: 1px solid #444;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .pass-suggestion .btn-regen:hover { color: #fff; border-color: #888; }

    @media (max-width: 480px) {
      body { padding: 12px; align-items: flex-start; }
      .form-container { padding: 24px 16px; }
      h2 { font-size: 20px; }
      input { font-size: 13px; padding: 8px; }
      button { padding: 10px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="robot">
      <img src="https://i.pinimg.com/originals/4b/cb/1f/4bcb1fb72d1d08efa44efa5ceb712ec7.gif" alt="Robot animado">
    </div>

    <h2>Registro de Usuario</h2>


  <!-- Mensaje de éxito o error -->
  <div id="mensajeRegistro" th:if="${mensaje}" th:text="${mensaje}" style="display:none;"></div>

  <form th:action="@{/registro/guardar}" method="post" th:object="${usuario}">

      <!-- 🟥 Caja de errores -->
      <div th:if="${#fields.hasErrors()}" class="error-container">
        <button class="close-btn" type="button" onclick="this.parentElement.style.display='none'">✖</button>
        <ul>
          <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
        </ul>
      </div>

      <label>Nombre de usuario</label>
      <input type="text" th:field="*{nombreUsuario}" required>

      <label>Nombres</label>
      <input type="text" th:field="*{nombres}" required>

      <label>Apellidos</label>
      <input type="text" th:field="*{apellidos}" required>

      <label>Correo Electrónico</label>
      <input type="email" id="correo" th:field="*{correo}" required />
      <span class="field-error-msg" id="correo-error">Los correos no coinciden.</span>

      <label>Confirmar Correo Electrónico</label>
      <input type="email" id="confirmCorreo" placeholder="Repite tu correo" required />
      <span class="field-error-msg" id="confirmCorreo-error">Los correos no coinciden.</span>

      <label>Número de Documento</label>
      <input type="text" id="noDocumento" th:field="*{noDocumento}" inputmode="numeric" pattern="[0-9]+" required />

      <label>Contraseña</label>
      <div class="pass-wrapper">
        <input type="password" id="passUsuario" th:field="*{passUsuario}" required autocomplete="new-password" />
        <div class="pass-suggestion" id="passSuggestion">
          <p>💡 Contraseña sugerida:</p>
          <div class="suggested-pass" id="suggestedPass"></div>
          <button type="button" class="btn-use-pass" onclick="usarContrasena()">Usar esta contraseña</button>
          <button type="button" class="btn-regen" onclick="generarContrasena()">↻ Generar otra</button>
        </div>
      </div>

      <label>Confirmar Contraseña</label>
      <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required />
      <span class="field-error-msg" id="pass-error">Las contraseñas no coinciden.</span>

      <button type="submit">Registrarse</button>
    </form>

    <button class="btn-google" onclick="alert('Registro con Google no disponible aún')">Registrarse con Google</button>

    <a th:href="@{/login}" class="btn-login">Volver al Login</a>
  </div>

  <script>
    // SweetAlert para mensajes flash
    const mensaje = document.getElementById("mensajeRegistro");
    if(mensaje && mensaje.innerText.trim() !== ""){
      Swal.fire({
        icon: mensaje.innerText.includes('correctamente') ? 'success' : 'error',
        title: mensaje.innerText.includes('correctamente') ? '¡Éxito!' : 'Error',
        text: mensaje.innerText,
        confirmButtonColor: '#006B2D',
        timer: 3500,
        timerProgressBar: true
      });
    }

    // Solo números en documento
    document.getElementById('noDocumento').addEventListener('input', function() {
      this.value = this.value.replace(/[^0-9]/g, '');
    });
    document.getElementById('noDocumento').addEventListener('keypress', function(e) {
      if (!/[0-9]/.test(e.key)) e.preventDefault();
    });

    // Generador de contraseña segura
    function generarContrasena() {
      const upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
      const lower = 'abcdefghjkmnpqrstuvwxyz';
      const digits = '23456789';
      const symbols = '@#$%&*!';
      const all = upper + lower + digits + symbols;
      let pass = [
        upper[Math.floor(Math.random() * upper.length)],
        lower[Math.floor(Math.random() * lower.length)],
        digits[Math.floor(Math.random() * digits.length)],
        symbols[Math.floor(Math.random() * symbols.length)]
      ];
      for (let i = 4; i < 12; i++) {
        pass.push(all[Math.floor(Math.random() * all.length)]);
      }
      // Mezclar
      pass = pass.sort(() => Math.random() - 0.5).join('');
      document.getElementById('suggestedPass').textContent = pass;
    }

    function usarContrasena() {
      const pass = document.getElementById('suggestedPass').textContent;
      const passInput = document.getElementById('passUsuario');
      const confirmInput = document.getElementById('confirmPassword');
      passInput.type = 'text';
      confirmInput.type = 'text';
      passInput.value = pass;
      confirmInput.value = pass;
      // Volver a password tras 1.5s para que el usuario la vea
      setTimeout(() => {
        passInput.type = 'password';
        confirmInput.type = 'password';
      }, 1500);
      document.getElementById('passSuggestion').style.display = 'none';
      validarPasswords();
    }

    // Mostrar/ocultar sugeridor al hacer foco en contraseña
    const passInput = document.getElementById('passUsuario');
    const passSuggestion = document.getElementById('passSuggestion');

    passInput.addEventListener('focus', function() {
      if (!document.getElementById('suggestedPass').textContent) {
        generarContrasena();
      }
      passSuggestion.style.display = 'block';
    });

    // Cerrar si se hace clic fuera
    document.addEventListener('click', function(e) {
      if (!passInput.contains(e.target) && !passSuggestion.contains(e.target)) {
        passSuggestion.style.display = 'none';
      }
    });
    // Validación correo en tiempo real
    function validarCorreos() {
      const correo = document.getElementById('correo').value;
      const confirm = document.getElementById('confirmCorreo').value;
      const errorCorreo = document.getElementById('correo-error');
      const errorConfirm = document.getElementById('confirmCorreo-error');
      const match = correo === confirm;
      if (confirm.length > 0 && !match) {
        errorCorreo.style.display = 'block';
        errorConfirm.style.display = 'block';
        document.getElementById('correo').classList.add('input-error');
        document.getElementById('confirmCorreo').classList.add('input-error');
      } else {
        errorCorreo.style.display = 'none';
        errorConfirm.style.display = 'none';
        document.getElementById('correo').classList.remove('input-error');
        document.getElementById('confirmCorreo').classList.remove('input-error');
      }
      return match;
    }

    // Validación contraseña en tiempo real
    function validarPasswords() {
      const pass = document.getElementById('passUsuario').value;
      const confirm = document.getElementById('confirmPassword').value;
      const error = document.getElementById('pass-error');
      const match = pass === confirm;
      if (confirm.length > 0 && !match) {
        error.style.display = 'block';
        document.getElementById('passUsuario').classList.add('input-error');
        document.getElementById('confirmPassword').classList.add('input-error');
      } else {
        error.style.display = 'none';
        document.getElementById('passUsuario').classList.remove('input-error');
        document.getElementById('confirmPassword').classList.remove('input-error');
      }
      return match;
    }

    document.getElementById('correo').addEventListener('input', validarCorreos);
    document.getElementById('confirmCorreo').addEventListener('input', validarCorreos);
    document.getElementById('passUsuario').addEventListener('input', validarPasswords);
    document.getElementById('confirmPassword').addEventListener('input', validarPasswords);

    // Bloquear envío si no coinciden
    document.querySelector('form').addEventListener('submit', function(e) {
      const correosOk = validarCorreos();
      const passOk = validarPasswords();
      if (!correosOk || !passOk) {
        e.preventDefault();
        Swal.fire({
          icon: 'error',
          title: 'Verifica los campos',
          text: !correosOk ? 'Los correos no coinciden.' : 'Las contraseñas no coinciden.',
          confirmButtonColor: '#006B2D'
        });
      }
    });
  </script>
</body>
</html>
