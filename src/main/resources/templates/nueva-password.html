<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/png" th:href="@{/img/logo_sia_fondo.png}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nueva Contraseña - SIA</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    html, body {
      height: 100%; margin: 0; padding: 0;
      font-family: 'Poppins', sans-serif; overflow-x: hidden;
    }
    body {
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 20px; box-sizing: border-box;
      background: url('https://www.bloomberglinea.com/resizer/v2/RAEW7WILHFA3JJHMQAYOWKN4EM.jpeg?auth=2d9996b6e3bd09f86ba0666285d6c9a921996fb4e8ae4470773335616e80f35e&width=800&height=533&quality=80&smart=true') no-repeat center center fixed;
      background-size: cover;
    }
    .card {
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(0, 255, 174, 0.35);
      border-radius: 16px;
      padding: 40px 32px;
      width: 100%; max-width: 400px;
      box-sizing: border-box;
      text-align: center;
      color: #fff;
      box-shadow: 0 8px 24px rgba(0,255,174,0.15);
    }
    .icon { font-size: 48px; color: #00ffae; margin-bottom: 12px; }
    h2 { color: #00ffae; font-size: 22px; margin: 0 0 8px; }
    p.sub { color: #aaa; font-size: 13px; margin: 0 0 24px; }
    label { display: block; text-align: left; font-size: 13px; color: #ccc; margin-bottom: 6px; margin-top: 14px; }
    .input-wrap { position: relative; }
    input[type="password"], input[type="text"] {
      width: 100%; padding: 11px 40px 11px 14px; border-radius: 8px;
      border: 1px solid #444; background: #fff; color: #000;
      font-size: 14px; box-sizing: border-box;
      transition: border 0.3s, box-shadow 0.3s;
    }
    input:focus { outline: none; border-color: #00ffae; box-shadow: 0 0 8px rgba(0,255,174,0.4); }
    input.err { border-color: #ff4444 !important; }
    .toggle-eye {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%); cursor: pointer; color: #555;
    }
    .field-err { color: #ff6b6b; font-size: 12px; text-align: left; margin-top: 4px; display: none; }
    .strength-bar {
      height: 4px; border-radius: 4px; margin-top: 6px;
      background: #333; transition: background 0.3s, width 0.3s;
    }
    .strength-label { font-size: 11px; text-align: left; margin-top: 3px; color: #aaa; }
    .btn {
      width: 100%; padding: 12px; margin-top: 22px;
      background: #00ffae; color: #000; border: none;
      border-radius: 8px; font-weight: bold; font-size: 15px;
      cursor: pointer; transition: background 0.3s, transform 0.2s;
    }
    .btn:hover { background: #00d996; transform: scale(1.02); }
    .alert-err {
      padding: 10px 14px; border-radius: 8px; font-size: 13px;
      margin-bottom: 16px; text-align: left;
      background: rgba(255,60,60,0.15); border: 1px solid #ff4444; color: #ff6b6b;
    }
    @media (max-width: 480px) { .card { padding: 28px 18px; } h2 { font-size: 18px; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><i class="fas fa-key"></i></div>
    <h2>Nueva contraseña</h2>
    <p class="sub">Elige una contraseña segura de al menos 6 caracteres.</p>

    <div th:if="${error}" class="alert-err">
      <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
    </div>

    <form th:action="@{/recuperar-password/nueva}" method="post" id="formNueva">
      <input type="hidden" name="token" th:value="${token}"/>

      <label><i class="fas fa-lock"></i> Nueva contraseña</label>
      <div class="input-wrap">
        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required autofocus/>
        <i class="fas fa-eye-slash toggle-eye" onclick="toggleVer('password', this)"></i>
      </div>
      <div class="strength-bar" id="strengthBar"></div>
      <div class="strength-label" id="strengthLabel"></div>

      <label><i class="fas fa-lock"></i> Confirmar contraseña</label>
      <div class="input-wrap">
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite la contraseña" required/>
        <i class="fas fa-eye-slash toggle-eye" onclick="toggleVer('confirmPassword', this)"></i>
      </div>
      <div class="field-err" id="matchErr">Las contraseñas no coinciden.</div>

      <button type="submit" class="btn"><i class="fas fa-save"></i> Guardar contraseña</button>
    </form>
  </div>

  <script>
    function toggleVer(id, icon) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      }
    }

    // Indicador de fortaleza
    document.getElementById('password').addEventListener('input', function() {
      const val = this.value;
      const bar = document.getElementById('strengthBar');
      const label = document.getElementById('strengthLabel');
      let score = 0;
      if (val.length >= 6) score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const niveles = [
        { color: '#ff4444', texto: 'Muy débil', w: '20%' },
        { color: '#ff8c00', texto: 'Débil',     w: '40%' },
        { color: '#ffd700', texto: 'Regular',   w: '60%' },
        { color: '#00d996', texto: 'Fuerte',    w: '80%' },
        { color: '#00ffae', texto: 'Muy fuerte',w: '100%' },
      ];
      const n = niveles[Math.min(score, 4)];
      bar.style.background = n.color;
      bar.style.width = n.w;
      label.style.color = n.color;
      label.textContent = val.length > 0 ? n.texto : '';
    });

    // Validar coincidencia
    function validarMatch() {
      const p = document.getElementById('password').value;
      const c = document.getElementById('confirmPassword').value;
      const err = document.getElementById('matchErr');
      const input = document.getElementById('confirmPassword');
      if (c.length > 0 && p !== c) {
        err.style.display = 'block';
        input.classList.add('err');
        return false;
      }
      err.style.display = 'none';
      input.classList.remove('err');
      return true;
    }

    document.getElementById('confirmPassword').addEventListener('input', validarMatch);

    document.getElementById('formNueva').addEventListener('submit', function(e) {
      if (!validarMatch()) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
