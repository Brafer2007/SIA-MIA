<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
    <link rel="icon" type="image/png" th:href="@{/img/logo_sia_fondo.png}">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Tareas - Aprendiz SENA</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: hidden; }
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #FFFFFF;
      color: #161616;
      display: flex;
    }
    .sidebar {
      width: 250px;
      background: #006B2D;
      padding: 20px;
      height: 100vh;
      position: fixed;
      top: 0; left: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 2px 0 10px rgba(0,107,45,0.2);
    }
    .sidebar .logo {
      color: #fff;
      font-size: 1.2rem;
      font-weight: 600;
      padding: 10px 0 20px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      margin-bottom: 10px;
    }
    .sidebar a {
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 8px;
      transition: background 0.3s;
    }
    .sidebar a:hover, .sidebar a.active { background: #008D4D; }
    .content {
      margin-left: 250px;
      padding: 30px;
      flex-grow: 1;
      background-color: #FFFFFF;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .page-header h1 { color: #006B2D; font-size: 1.6rem; }
    .card {
      background: #F0FFF0;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,107,45,0.08);
      border: 1px solid #e0f0e0;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: #006B2D;
      color: #fff;
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
    }
    tbody tr {
      border-bottom: 1px solid #e0f0e0;
      transition: background 0.2s;
    }
    tbody tr:hover { background: #f5fff5; }
    tbody td { padding: 12px 16px; color: #161616; vertical-align: middle; }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .badge-pendiente  { background: #fff3cd; color: #856404; }
    .badge-entregada  { background: #cce5ff; color: #004085; }
    .badge-calificada { background: #d4edda; color: #155724; }
    .badge-vencida    { background: #f8d7da; color: #721c24; }
    .btn-link {
      background: #006B2D;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.3s;
    }
    .btn-link:hover { background: #008D4D; }
    .empty-msg { text-align: center; padding: 40px; color: #666; }
    .empty-msg i { font-size: 2.5rem; color: #ccc; margin-bottom: 12px; display: block; }

/* ===== RESPONSIVE MOBILE ===== */
.hamburger-btn {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 200;
  background: #006B2D;
  color: #fff;
  border: none;
  border-radius: 6px;
  width: 40px;
  height: 40px;
  font-size: 20px;
  cursor: pointer;
  line-height: 1;
}
.sidebar-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.5);
  z-index: 150;
}
.sidebar-overlay.active { display: block; }
@media (max-width: 768px) {
  .hamburger-btn { display: block; }
  .sidebar {
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    z-index: 160;
  }
  .sidebar.open { transform: translateX(0); }
  .content, .main-content {
    margin-left: 0 !important;
    padding: 60px 15px 15px !important;
  }
}
  </style>
</head>
<body>
  <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleSidebar()" aria-label="Abrir menú">&#9776;</button>
  <div class="sidebar">
    <div class="logo"><i class="fas fa-user-graduate"></i> SENA Aprendiz</div>
    <a th:href="@{/aprendiz/tareas}" class="active"><i class="fas fa-tasks"></i> Mis Tareas</a>
    <a th:href="@{/dashboardAprendiz}"><i class="fas fa-home"></i> Volver al Dashboard</a>
    <a th:href="@{/login}" style="margin-top: auto;"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
  </div>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <div class="content">
    <div class="page-header">
      <h1><i class="fas fa-tasks"></i> Mis Tareas</h1>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Título</th>
            <th>Instructor</th>
            <th>Fecha Límite</th>
            <th>Estado</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="tarea : ${tareas}">
            <td th:text="${tarea.titulo}"></td>
            <td th:text="${tarea.nombreInstructor}"></td>
            <td th:text="${#temporals.format(tarea.fechaLimite, 'dd/MM/yyyy HH:mm')}"></td>
            <td>
              <span th:if="${tarea.estadoEntrega == 'PENDIENTE'}"  class="badge badge-pendiente"><i class="fas fa-clock"></i> Pendiente</span>
              <span th:if="${tarea.estadoEntrega == 'ENTREGADA'}"  class="badge badge-entregada"><i class="fas fa-paper-plane"></i> Entregada</span>
              <span th:if="${tarea.estadoEntrega == 'CALIFICADA'}" class="badge badge-calificada"><i class="fas fa-star"></i> Calificada</span>
              <span th:if="${tarea.estadoEntrega == 'VENCIDA'}"    class="badge badge-vencida"><i class="fas fa-times-circle"></i> Vencida</span>
            </td>
            <td>
              <a th:href="@{/aprendiz/tareas/{id}(id=${tarea.idTarea})}" class="btn-link">
                <i class="fas fa-eye"></i> Ver Detalle
              </a>
            </td>
          </tr>
          <tr th:if="${tareas == null or #lists.isEmpty(tareas)}">
            <td colspan="5">
              <div class="empty-msg">
                <i class="fas fa-inbox"></i>
                <p>No tienes tareas asignadas por el momento.</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
<script>
function toggleSidebar() {
  document.querySelector('.sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('active');
}
function closeSidebar() {
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('active');
}
</script>
</body>
</html>
