<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/png" th:href="@{/img/logo_sia_fondo.png}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recuperar Contraseña - SIA</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    html, body {
      height: 100%; margin: 0; padding: 0;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
    }
    body {
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 20px; box-sizing: border-box;
      background: linear-gradient(135deg, #001a0e 0%, #003d1f 30%, #006B2D 60%, #004d20 80%, #001a0e 100%);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
    }
    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    }
    .card {
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(0, 255, 174, 0.35);
      border-radius: 16px;
      padding: 40px 32px;
      width: 100%; max-width: 400px;
      box-sizing: border-box;
      text-align: center;
      color: #fff;
      box-shadow: 0 8px 24px rgba(0,255,174,0.15);
    }
    .icon { font-size: 48px; color: #00ffae; margin-bottom: 12px; }
    h2 { color: #00ffae; font-size: 22px; margin: 0 0 8px; }
    p.sub { color: #aaa; font-size: 13px; margin: 0 0 24px; }
    label { display: block; text-align: left; font-size: 13px; color: #ccc; margin-bottom: 6px; }
    input[type="email"] {
      width: 100%; padding: 11px 14px; border-radius: 8px;
      border: 1px solid #444; background: #fff; color: #000;
      font-size: 14px; box-sizing: border-box;
      transition: border 0.3s, box-shadow 0.3s;
    }
    input[type="email"]:focus {
      outline: none; border-color: #00ffae;
      box-shadow: 0 0 8px rgba(0,255,174,0.4);
    }
    .btn {
      width: 100%; padding: 12px; margin-top: 18px;
      background: #00ffae; color: #000; border: none;
      border-radius: 8px; font-weight: bold; font-size: 15px;
      cursor: pointer; transition: background 0.3s, transform 0.2s;
    }
    .btn:hover { background: #00d996; transform: scale(1.02); }
    .alert {
      padding: 10px 14px; border-radius: 8px;
      font-size: 13px; margin-bottom: 16px; text-align: left;
    }
    .alert-ok { background: rgba(0,255,174,0.15); border: 1px solid #00ffae; color: #00ffae; }
    .alert-err { background: rgba(255,60,60,0.15); border: 1px solid #ff4444; color: #ff6b6b; }
    .back { display: inline-block; margin-top: 20px; color: #00ffae; font-size: 13px; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    @media (max-width: 480px) { .card { padding: 28px 18px; } h2 { font-size: 18px; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><i class="fas fa-lock-open"></i></div>
    <h2>¿Olvidaste tu contraseña?</h2>
    <p class="sub">Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>

    <div th:if="${mensaje}" class="alert alert-ok">
      <i class="fas fa-check-circle"></i> <span th:text="${mensaje}"></span>
    </div>
    <div th:if="${error}" class="alert alert-err">
      <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
    </div>

    <form th:action="@{/recuperar-password}" method="post">
      <label for="correo"><i class="fas fa-envelope"></i> Correo electrónico</label>
      <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required autofocus/>
      <button type="submit" class="btn"><i class="fas fa-paper-plane"></i> Enviar enlace</button>
    </form>

    <a th:href="@{/login}" class="back"><i class="fas fa-arrow-left"></i> Volver al inicio de sesión</a>
  </div>
</body>
</html>
