<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
    <link rel="icon" type="image/png" th:href="@{/img/logo_sia_fondo.png}">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entregas de Tarea - Instructor SENA</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #FFFFFF;
      color: #161616;
      display: flex;
    }
    .sidebar {
      width: 250px;
      background: #006B2D;
      padding: 20px;
      height: 100vh;
      position: fixed;
      top: 0; left: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 2px 0 10px rgba(0,107,45,0.2);
    }
    .sidebar .logo {
      color: #fff;
      font-size: 1.2rem;
      font-weight: 600;
      padding: 10px 0 20px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      margin-bottom: 10px;
    }
    .sidebar a {
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 8px;
      transition: background 0.3s;
    }
    .sidebar a:hover { background: #008D4D; }
    .content {
      margin-left: 250px;
      padding: 30px;
      flex-grow: 1;
      background-color: #FFFFFF;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .page-header h1 {
      color: #006B2D;
      font-size: 1.6rem;
    }
    .btn-back {
      background: #fff;
      color: #006B2D;
      border: 2px solid #006B2D;
      padding: 8px 18px;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }
    .btn-back:hover { background: #F0FFF0; }
    .alert-error {
      background: #f8d7da;
      color: #721c24;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .alert-success {
      background: #d4edda;
      color: #155724;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card {
      background: #F0FFF0;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,107,45,0.08);
      border: 1px solid #e0f0e0;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      background: #006B2D;
      color: #fff;
      padding: 12px 14px;
      text-align: left;
      font-weight: 600;
      font-size: 0.9rem;
    }
    tbody tr {
      border-bottom: 1px solid #e0f0e0;
      transition: background 0.2s;
    }
    tbody tr:hover { background: #f5fff5; }
    tbody td {
      padding: 12px 14px;
      color: #161616;
      vertical-align: middle;
      font-size: 0.9rem;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .badge-entregado { background: #d4edda; color: #155724; }
    .badge-pendiente { background: #e2e3e5; color: #383d41; }
    .btn-download {
      background: #006B2D;
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.82rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.3s;
    }
    .btn-download:hover { background: #008D4D; }
    .calificar-form {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .calificar-form input[type="number"] {
      width: 70px;
      padding: 5px 8px;
      border: 1px solid #8d918d;
      border-radius: 5px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      background: #fff;
    }
    .calificar-form input[type="text"] {
      width: 140px;
      padding: 5px 8px;
      border: 1px solid #8d918d;
      border-radius: 5px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      background: #fff;
    }
    .btn-save {
      background: #006B2D;
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.3s;
    }
    .btn-save:hover { background: #008D4D; }
    .nota-display {
      font-weight: 600;
      color: #006B2D;
    }
    .empty-msg {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    .empty-msg i { font-size: 2.5rem; color: #ccc; margin-bottom: 12px; display: block; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="logo"><i class="fas fa-graduation-cap"></i> SENA Instructor</div>
    <a th:href="@{/instructor/tareas}"><i class="fas fa-tasks"></i> Mis Tareas</a>
    <a th:href="@{/instructor/tareas/nueva}"><i class="fas fa-plus-circle"></i> Nueva Tarea</a>
    <a th:href="@{/dashboardInstructor}"><i class="fas fa-home"></i> Volver al Dashboard</a>
    <a th:href="@{/login}" style="margin-top: auto;"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
  </div>

  <div class="content">
    <div class="page-header">
      <h1><i class="fas fa-clipboard-list"></i> Entregas de la Tarea</h1>
      <a th:href="@{/instructor/tareas}" class="btn-back">
        <i class="fas fa-arrow-left"></i> Volver a Mis Tareas
      </a>
    </div>

    <div th:if="${error}" class="alert-error">
      <i class="fas fa-exclamation-circle"></i>
      <span th:text="${error}"></span>
    </div>

    <div th:if="${exito}" class="alert-success">
      <i class="fas fa-check-circle"></i>
      <span th:text="${exito}"></span>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Estado</th>
            <th>Fecha Entrega</th>
            <th>Archivo</th>
            <th>Nota</th>
            <th>Comentario</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="entrega : ${entregas}">
            <!-- Nombre -->
            <td th:text="${entrega.nombreAprendiz}"></td>

            <!-- Estado con badge -->
            <td>
              <span th:if="${entrega.estadoEntrega == 'ENTREGADO'}"
                    class="badge badge-entregado">
                <i class="fas fa-check"></i> Entregado
              </span>
              <span th:if="${entrega.estadoEntrega != 'ENTREGADO'}"
                    class="badge badge-pendiente">
                <i class="fas fa-clock"></i> Pendiente
              </span>
            </td>

            <!-- Fecha entrega -->
            <td>
              <span th:if="${entrega.fechaEntrega != null}"
                    th:text="${#temporals.format(entrega.fechaEntrega, 'dd/MM/yyyy HH:mm')}"></span>
              <span th:if="${entrega.fechaEntrega == null}" style="color:#aaa;">—</span>
            </td>

            <!-- Archivo descarga -->
            <td>
              <a th:if="${entrega.rutaArchivo != null}"
                 th:href="@{/{ruta}(ruta=${entrega.rutaArchivo})}"
                 class="btn-download"
                 target="_blank">
                <i class="fas fa-download"></i> Descargar
              </a>
              <span th:if="${entrega.rutaArchivo == null}" style="color:#aaa;">—</span>
            </td>

            <!-- Nota actual -->
            <td>
              <span th:if="${entrega.nota != null}"
                    class="nota-display"
                    th:text="${entrega.nota}"></span>
              <span th:if="${entrega.nota == null}" style="color:#aaa;">Sin calificar</span>
            </td>

            <!-- Comentario actual -->
            <td>
              <span th:if="${entrega.comentario != null and !#strings.isEmpty(entrega.comentario)}"
                    th:text="${entrega.comentario}"></span>
              <span th:if="${entrega.comentario == null or #strings.isEmpty(entrega.comentario)}"
                    style="color:#aaa;">—</span>
            </td>

            <!-- Formulario de calificación (solo si hay entrega) -->
            <td>
              <form th:if="${entrega.idEntrega != null}"
                    th:action="@{/instructor/tareas/{id}/calificar/{idEntrega}(id=${idTarea},idEntrega=${entrega.idEntrega})}"
                    method="post"
                    class="calificar-form">
                <input type="number"
                       name="nota"
                       min="0" max="5" step="0.1"
                       th:value="${entrega.nota}"
                       placeholder="0-5"
                       required>
                <input type="text"
                       name="comentario"
                       th:value="${entrega.comentario}"
                       placeholder="Comentario">
                <button type="submit" class="btn-save">
                  <i class="fas fa-save"></i> Guardar
                </button>
              </form>
              <span th:if="${entrega.idEntrega == null}" style="color:#aaa;">—</span>
            </td>
          </tr>

          <tr th:if="${entregas == null or #lists.isEmpty(entregas)}">
            <td colspan="7">
              <div class="empty-msg">
                <i class="fas fa-inbox"></i>
                <p>No hay aprendices registrados para esta tarea.</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
