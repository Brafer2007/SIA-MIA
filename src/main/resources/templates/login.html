<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/png" th:href="@{/img/logo_sia_fondo.png}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión - SIA</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%; font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
    }

    /* ── Fondo animado ── */
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #001a0e 0%, #003d1f 30%, #006B2D 60%, #004d20 80%, #001a0e 100%);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      display: flex; flex-direction: column;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Partículas decorativas */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(0,255,174,0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0,255,174,0.06) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(0,107,45,0.15) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    /* ── Header ── */
    header {
      position: relative; z-index: 10;
      padding: 14px 24px;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,255,174,0.15);
      display: flex; justify-content: space-between; align-items: center;
    }

    .brand {
      color: #00ffae; font-weight: 700; font-size: 18px; letter-spacing: 2px;
    }

    .nav-links { display: flex; gap: 10px; }

    .nav-btn {
      padding: 7px 18px; font-size: 13px; font-weight: 500;
      color: #fff; border: 1.5px solid rgba(0,255,174,0.5);
      border-radius: 20px; text-decoration: none;
      transition: all 0.3s; background: transparent;
      cursor: pointer;
    }
    .nav-btn:hover { background: #00ffae; color: #000; border-color: #00ffae; }

    /* ── Main ── */
    main {
      flex: 1; display: flex; justify-content: center; align-items: center;
      padding: 30px 20px; position: relative; z-index: 1;
    }

    /* ── Card ── */
    .login-card {
      width: 100%; max-width: 420px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0,255,174,0.2);
      border-radius: 24px;
      padding: 44px 36px;
      box-shadow:
        0 0 0 1px rgba(0,255,174,0.05),
        0 20px 60px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.08);
      animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
      position: relative;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Brillo superior */
    .login-card::before {
      content: '';
      position: absolute; top: 0; left: 20%; right: 20%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,255,174,0.6), transparent);
      border-radius: 50%;
    }

    /* ── Robot ── */
    .robot-wrap {
      text-align: center; margin-bottom: 8px;
    }
    .robot-wrap img {
      width: 90px; height: 90px; object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(0,255,174,0.4));
    }

    /* ── Título ── */
    .card-title {
      text-align: center; margin-bottom: 28px;
    }
    .card-title h1 {
      font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 4px;
    }
    .card-title p { font-size: 13px; color: rgba(255,255,255,0.45); }

    /* ── Error ── */
    .alert-error {
      background: rgba(255,60,60,0.12);
      border: 1px solid rgba(255,80,80,0.4);
      border-radius: 10px; padding: 10px 14px;
      margin-bottom: 20px; font-size: 13px; color: #ff8080;
      display: flex; align-items: flex-start; gap: 8px;
    }
    .alert-error .close-x {
      margin-left: auto; cursor: pointer; font-size: 16px; line-height: 1;
      color: #ff8080; flex-shrink: 0;
    }

    /* ── Inputs ── */
    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600;
      color: rgba(255,255,255,0.6); margin-bottom: 7px;
      text-transform: uppercase; letter-spacing: 0.8px;
    }
    .input-wrap {
      position: relative; display: flex; align-items: center;
    }
    .input-wrap .icon {
      position: absolute; left: 14px; color: rgba(255,255,255,0.3);
      font-size: 14px; pointer-events: none;
    }
    .input-wrap input {
      width: 100%; padding: 12px 42px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; color: #fff; font-size: 14px;
      font-family: 'Poppins', sans-serif;
      transition: all 0.3s; outline: none;
    }
    .input-wrap input::placeholder { color: rgba(255,255,255,0.25); }
    .input-wrap input:focus {
      border-color: rgba(0,255,174,0.6);
      background: rgba(0,255,174,0.05);
      box-shadow: 0 0 0 3px rgba(0,255,174,0.1);
    }
    .input-wrap .eye {
      position: absolute; right: 14px; cursor: pointer;
      color: rgba(255,255,255,0.3); font-size: 14px;
      transition: color 0.2s;
    }
    .input-wrap .eye:hover { color: #00ffae; }

    /* ── Forgot ── */
    .forgot {
      text-align: right; margin-top: -10px; margin-bottom: 22px;
    }
    .forgot a {
      font-size: 12px; color: rgba(0,255,174,0.7); text-decoration: none;
      transition: color 0.2s;
    }
    .forgot a:hover { color: #00ffae; }

    /* ── Botones ── */
    .btn-primary {
      width: 100%; padding: 13px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #00ffae, #00d996);
      color: #001a0e; font-weight: 700; font-size: 15px;
      cursor: pointer; transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(0,255,174,0.3);
      font-family: 'Poppins', sans-serif;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,255,174,0.45);
    }
    .btn-primary:active { transform: translateY(0); }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0; color: rgba(255,255,255,0.2); font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px;
      background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
      width: 100%; padding: 12px; border-radius: 12px;
      border: 1.5px solid rgba(0,255,174,0.3);
      background: transparent; color: #00ffae;
      font-weight: 600; font-size: 14px; cursor: pointer;
      transition: all 0.3s; font-family: 'Poppins', sans-serif;
    }
    .btn-secondary:hover {
      background: rgba(0,255,174,0.08);
      border-color: #00ffae;
    }

    @media (max-width: 480px) {
      .login-card { padding: 32px 22px; }
      header { padding: 12px 16px; }
      .brand { font-size: 15px; }
    }
  </style>
</head>
<body>
  <header>
    <span class="brand">SIA · SENA</span>
    <nav class="nav-links">
      <a th:href="@{/}" class="nav-btn">Inicio</a>
    </nav>
  </header>

  <main>
    <div class="login-card">

      <div class="robot-wrap">
        <img src="https://i.pinimg.com/originals/4b/cb/1f/4bcb1fb72d1d08efa44efa5ceb712ec7.gif" alt="Robot SIA">
      </div>

      <div class="card-title">
        <h1>Bienvenido</h1>
        <p>Inicia sesión en tu cuenta</p>
      </div>

      <!-- Error -->
      <div th:if="${error}" class="alert-error">
        <i class="fas fa-exclamation-circle"></i>
        <span th:text="${error}"></span>
        <span class="close-x" onclick="this.parentElement.remove()">&times;</span>
      </div>

      <!-- Éxito (recuperación) -->
      <div th:if="${exito}" style="background:rgba(0,255,174,0.1); border:1px solid rgba(0,255,174,0.4); border-radius:10px; padding:10px 14px; margin-bottom:20px; font-size:13px; color:#00ffae;">
        <i class="fas fa-check-circle"></i> <span th:text="${exito}"></span>
      </div>

      <form th:action="@{/login}" method="post">

        <div class="field">
          <label>Usuario</label>
          <div class="input-wrap">
            <i class="fas fa-user icon"></i>
            <input type="text" name="email" placeholder="Correo o nombre de usuario" required autofocus/>
          </div>
        </div>

        <div class="field">
          <label>Contraseña</label>
          <div class="input-wrap">
            <i class="fas fa-lock icon"></i>
            <input type="password" id="password" name="password" placeholder="Tu contraseña" required/>
            <i class="fas fa-eye-slash eye" id="eyeIcon" onclick="togglePassword()"></i>
          </div>
        </div>

        <div class="forgot">
          <a th:href="@{/recuperar-password}">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-primary">
          <i class="fas fa-sign-in-alt"></i> Entrar
        </button>
      </form>

      <div class="divider">o</div>

      <form th:action="@{/registro}" method="get">
        <button type="submit" class="btn-secondary">
          <i class="fas fa-user-plus"></i> Crear cuenta nueva
        </button>
      </form>

    </div>
  </main>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const icon  = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      }
    }
  </script>
</body>
</html>
