<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
    <link rel="icon" type="image/png" th:href="@{/img/logo_sia_fondo.png}">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Tareas - Instructor SENA</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #FFFFFF;
      color: #161616;
      display: flex;
    }
    .sidebar {
      width: 250px;
      background: #006B2D;
      padding: 20px;
      height: 100vh;
      position: fixed;
      top: 0; left: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 2px 0 10px rgba(0,107,45,0.2);
    }
    .sidebar .logo {
      color: #fff;
      font-size: 1.2rem;
      font-weight: 600;
      padding: 10px 0 20px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      margin-bottom: 10px;
    }
    .sidebar a {
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 8px;
      transition: background 0.3s;
    }
    .sidebar a:hover, .sidebar a.active {
      background: #008D4D;
    }
    .content {
      margin-left: 250px;
      padding: 30px;
      flex-grow: 1;
      background-color: #FFFFFF;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .page-header h1 {
      color: #006B2D;
      font-size: 1.6rem;
    }
    .btn-primary {
      background: #006B2D;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.3s;
    }
    .btn-primary:hover { background: #008D4D; }
    .alert-success {
      background: #d4edda;
      color: #155724;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card {
      background: #F0FFF0;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,107,45,0.08);
      border: 1px solid #e0f0e0;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      background: #006B2D;
      color: #fff;
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
    }
    tbody tr {
      border-bottom: 1px solid #e0f0e0;
      transition: background 0.2s;
    }
    tbody tr:hover { background: #f5fff5; }
    tbody td {
      padding: 12px 16px;
      color: #161616;
    }
    .btn-link {
      background: #006B2D;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.3s;
    }
    .btn-link:hover { background: #008D4D; }
    .empty-msg {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    .empty-msg i { font-size: 2.5rem; color: #ccc; margin-bottom: 12px; display: block; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="logo"><i class="fas fa-graduation-cap"></i> SENA Instructor</div>
    <a th:href="@{/instructor/tareas}" class="active"><i class="fas fa-tasks"></i> Mis Tareas</a>
    <a th:href="@{/instructor/tareas/nueva}"><i class="fas fa-plus-circle"></i> Nueva Tarea</a>
    <a th:href="@{/dashboardInstructor}"><i class="fas fa-home"></i> Volver al Dashboard</a>
    <a th:href="@{/login}" style="margin-top: auto;"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
  </div>

  <div class="content">
    <div class="page-header">
      <h1><i class="fas fa-tasks"></i> Mis Tareas</h1>
      <a th:href="@{/instructor/tareas/nueva}" class="btn-primary">
        <i class="fas fa-plus"></i> Nueva Tarea
      </a>
    </div>

    <div th:if="${exito}" class="alert-success">
      <i class="fas fa-check-circle"></i>
      <span th:text="${exito}"></span>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Título</th>
            <th>Ficha</th>
            <th>Fecha Límite</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="tarea : ${tareas}">
            <td th:text="${tarea.titulo}"></td>
            <td th:text="${tarea.nombreFicha}"></td>
            <td th:text="${#temporals.format(tarea.fechaLimite, 'dd/MM/yyyy HH:mm')}"></td>
            <td>
              <a th:href="@{/instructor/tareas/{id}/entregas(id=${tarea.id})}" class="btn-link">
                <i class="fas fa-eye"></i> Ver Entregas
              </a>
            </td>
          </tr>
          <tr th:if="${tareas == null or #lists.isEmpty(tareas)}">
            <td colspan="4">
              <div class="empty-msg">
                <i class="fas fa-inbox"></i>
                <p>No tienes tareas creadas aún.</p>
                <a th:href="@{/instructor/tareas/nueva}" class="btn-primary" style="margin-top:12px;">
                  <i class="fas fa-plus"></i> Crear primera tarea
                </a>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
