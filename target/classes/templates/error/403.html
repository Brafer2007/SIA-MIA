<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>403 — Acceso denegado</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { margin:0; height:100vh; background:linear-gradient(135deg,#1a0a00,#3a1500); font-family:'Poppins',sans-serif; display:flex; align-items:center; justify-content:center; color:#fff; overflow:hidden; }
    .container { text-align:center; z-index:1; }
    .code { font-family:'Fredoka One',cursive; font-size:5rem; color:#ff8c00; margin:0; }
    .title { font-size:1.8rem; font-weight:700; margin:10px 0; }
    .sub { font-size:1rem; color:rgba(255,255,255,0.75); margin-bottom:28px; }
    .btn { display:inline-block; padding:12px 28px; background:#ff8c00; color:#fff; border-radius:8px; text-decoration:none; font-weight:700; font-size:15px; transition:background 0.3s; }
    .btn:hover { background:#cc6e00; }
    .icon { font-size:80px; margin-bottom:16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🔒</div>
    <div class="code">403</div>
    <div class="title">Acceso denegado</div>
    <div class="sub">No tienes permisos para acceder a esta página.</div>
    <a th:href="${backUrl}" class="btn">← Regresar</a>
  </div>
</body>
</html>
